<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyrics overlay</title>
<!--
  Lyrics overlay for vMix (Web Browser input) or OBS (Browser Source).
  The page background is left unset so vMix renders it transparent (alpha).

  Options, added to the address, for example /overlay?pos=bottom&size=1.2&box=1
    pos=bottom|center|top   where the lyrics sit (default bottom)
    size=1                  text size multiplier (default 1)
    box=0|1                 dark semi-transparent box behind the text (default 0 = outlined text)
    next=0|1                also show the next line, smaller (default 0)
    align=center|left       text alignment (default center)
    margin=8                distance from the top/bottom edge, % of the height (default 8)
    title=0|1               show the song title above the first line of each song (default 0)
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center;
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    --size: 1; --margin: 8vh;
  }
  body.pos-bottom { justify-content: flex-end; padding-bottom: var(--margin); }
  body.pos-top    { justify-content: flex-start; padding-top: var(--margin); }
  body.pos-center { justify-content: center; }
  body { box-sizing: border-box; }

  #wrap { max-width: 86vw; text-align: center; }
  body.align-left #wrap { text-align: left; width: 86vw; }

  #title, #line, #next { color: #fff; overflow-wrap: anywhere; white-space: pre-line; }
  #line { font-size: calc(6vh * var(--size)); font-weight: 700; line-height: 1.2; }
  #next { font-size: calc(3.6vh * var(--size)); line-height: 1.25; margin-top: .5em; color: #d8d8d8; }
  #title { font-size: calc(3vh * var(--size)); margin-bottom: .4em; color: #e8e8e8; }

  /* Default: outlined text, readable over any video */
  body:not(.box) #title, body:not(.box) #line, body:not(.box) #next {
    text-shadow:
      0 0 .06em #000, 0 0 .06em #000, 0 0 .06em #000,
      .03em .03em 0 #000, -.03em -.03em 0 #000, .03em -.03em 0 #000, -.03em .03em 0 #000,
      0 .06em .25em rgba(0, 0, 0, .85);
  }

  /* box=1: dark panel behind the text */
  body.box #wrap { background: rgba(0, 0, 0, .62); border-radius: .4vh; padding: 1.4vh 2.4vw; }

  #wrap.empty, #title:empty, #next:empty { display: none; }
</style>
</head>
<body>
  <div id="wrap" class="empty">
    <div id="title"></div>
    <div id="line"></div>
    <div id="next"></div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const on = k => /^(1|yes|on|true)$/i.test(q.get(k) || '');
  const pos = ['top', 'center', 'bottom'].includes(q.get('pos')) ? q.get('pos') : 'bottom';
  const size = Math.min(4, Math.max(0.3, parseFloat(q.get('size')) || 1));
  const margin = Math.min(40, Math.max(0, parseFloat(q.get('margin') ?? '8')));

  document.body.classList.add('pos-' + pos);
  if (on('box')) document.body.classList.add('box');
  if (q.get('align') === 'left') document.body.classList.add('align-left');
  document.body.style.setProperty('--size', size);
  document.body.style.setProperty('--margin', (isNaN(margin) ? 8 : margin) + 'vh');

  function render(s) {
    // Nothing on screen during the welcome page or a blank screen
    const line = s.welcome ? '' : (s.line || '');
    $('line').textContent = line;
    $('next').textContent = on('next') && line ? (s.next || '') : '';
    $('title').textContent = on('title') && line && s.lineNo === 1 ? (s.title || '') : '';
    $('wrap').classList.toggle('empty', !line);
  }

  let es;
  function connect() {
    if (es) es.close();
    es = new EventSource('/events');
    es.onmessage = e => render(JSON.parse(e.data));
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
