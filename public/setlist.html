<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set lists – Lyrics Display</title>
<style>
  :root {
    --bg: #1c2230; --panel: #242b3a; --raise: #2d3547; --line: #3a4459;
    --text: #ebe8e1; --muted: #9ba4b6; --accent: #e3b448; --accent-ink: #231c05;
    --bad: #e46e62; --good: #74c38f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: .35em .75em; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.icon { padding: .2em .5em; min-width: 2em; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  input[type=search], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .35em .6em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: baseline; gap: 1.5em; padding: .8em 1.2em; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 1.25em; font-weight: 600; }
  header a { color: var(--muted); }
  header .status { margin-left: auto; color: var(--muted); font-size: .9em; }
  header .status.error { color: var(--bad); }

  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(380px, 1.4fr); min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; padding: 1em 1.2em; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 1.05em; margin: 0 0 .6em; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin-bottom: .7em; }
  .bar .grow { flex: 1; min-width: 10em; }
  .note { color: var(--muted); font-size: .88em; }

  .scroll { overflow: auto; min-height: 0; flex: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .lib-row { display: flex; align-items: center; gap: .6em; padding: .4em .6em; border-bottom: 1px solid var(--line); }
  .lib-row:last-child { border-bottom: 0; }
  .lib-row .name { flex: 1; min-width: 0; cursor: pointer; }
  .lib-row .name b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-row .name small { color: var(--muted); }
  .lib-row.in-set b::after { content: " ✓"; color: var(--good); }
  .empty { padding: 1.2em; color: var(--muted); }

  #setPane { display: grid; grid-template-rows: auto auto minmax(120px, 1.2fr) auto minmax(100px, 1fr); }
  .active-flag { display: inline-flex; align-items: center; gap: .4em; padding: .3em .7em; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .9em; }
  .active-flag.on { border-color: var(--good); color: var(--good); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .35em .5em; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.selected td { background: var(--raise); }
  td.num input { width: 5em; font-variant-numeric: tabular-nums; }
  td.num input.dup { border-color: var(--bad); color: var(--bad); }
  td.title { cursor: pointer; width: 100%; }
  td.title small { display: block; color: var(--muted); }
  td.title .warn { color: var(--bad); }
  td.midi { color: var(--muted); font-size: .85em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.tools { white-space: nowrap; }

  #preview { padding: .4em 0; }
  #preview .group { color: var(--accent); font-weight: 600; padding: .6em .8em .1em; }
  #preview .slide { display: grid; grid-template-columns: 3em 1fr; padding: .25em .8em; }
  #preview .slide span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  #preview .slide span:last-child { white-space: pre-line; }
  #preview .blank { color: var(--muted); font-style: italic; }
  .preview-head { display: flex; align-items: baseline; gap: .6em; margin: 1em 0 .5em; }
  .preview-head h2 { margin: 0; }

  @media (max-width: 820px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    section + section { border-left: 0; border-top: 1px solid var(--line); }
    .scroll { max-height: 55vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Set lists</h1>
  <a href="/control">Control page</a>
  <span class="status" id="status" role="status" aria-live="polite"></span>
</header>
<main>
  <section aria-labelledby="libTitle">
    <h2 id="libTitle">Song library</h2>
    <div class="bar">
      <input type="search" id="search" class="grow" placeholder="Search songs" aria-label="Search songs">
      <button id="refreshLib" title="Read the library folders again">Refresh</button>
    </div>
    <div class="scroll" id="library"><div class="empty">Loading…</div></div>
    <p class="note" id="libNote"></p>
  </section>

  <section id="setPane" aria-labelledby="setTitle">
    <h2 id="setTitle">Set list</h2>
    <div class="bar">
      <select id="setSelect" class="grow" aria-label="Set list"></select>
      <button id="newSet">New</button>
      <button id="copySet" title="Make a copy to edit for another service">Copy</button>
      <button id="renameSet">Rename</button>
      <button id="deleteSet" class="danger">Delete</button>
    </div>
    <div class="scroll" id="entries"></div>
    <div class="bar" style="margin-top:.7em">
      <button id="useSet" class="primary">Use for the service</button>
      <span class="active-flag" id="activeFlag"></span>
      <button id="renumber" title="Number the songs 1, 2, 3… in their current order">Renumber 1, 2, 3…</button>
    </div>
    <div style="display:flex;flex-direction:column;min-height:0">
      <div class="preview-head"><h2 id="previewTitle">Preview</h2><span class="note" id="previewNote">Click a song to see its slides.</span></div>
      <div class="scroll" id="preview"></div>
    </div>
  </section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
};

let library = [], useBanks = false;
let setlists = [], active = '', current = '';
let entries = [];               // { number, stored, title, missing, slides, folder }
let selected = null;            // stored path shown in the preview
let version = 0, savedVersion = 0, saving = false, saveTimer = null;

// ------------------------------------------------------------ helpers
function status(text, error = false) {
  const s = $('status');
  s.textContent = text;
  s.classList.toggle('error', error);
}

async function api(url, body) {
  const res = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok || data.ok === false) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function midiText(n) {
  if (useBanks) return `bank ${Math.floor((n - 1) / 128)}, PC ${((n - 1) % 128) + 1}`;
  return n <= 128 ? `PC ${n}` : 'control page only';
}

function nextSunday() {
  const d = new Date();
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} Sunday`;
}

function duplicates() {
  const count = new Map();
  for (const e of entries) count.set(e.number, (count.get(e.number) || 0) + 1);
  return new Set([...count].filter(([, c]) => c > 1).map(([n]) => n));
}

// ------------------------------------------------------------ library
async function loadLibrary(refresh) {
  try {
    const data = await api('/api/library' + (refresh ? '?refresh=1' : ''));
    library = data.files;
    const roots = data.roots.map(r => `${r.label}: ${r.dir}`).join('\n');
    $('libNote').textContent = data.roots.some(r => r.label === 'ProPresenter')
      ? `${library.length} songs${data.truncated ? ' (list cut short; the folder is very large)' : ''}.`
      : `ProPresenter library not found at ${data.libraryDir}. Set LIBRARY_DIR in start.bat.`;
    $('libNote').title = roots;
    renderLibrary();
  } catch (e) { status(e.message, true); }
}

function renderLibrary() {
  const box = $('library');
  const words = $('search').value.toLowerCase().split(/\s+/).filter(Boolean);
  const inSet = new Set(entries.map(e => e.stored));
  const hits = library.filter(f => {
    const hay = `${f.name} ${f.folder}`.toLowerCase();
    return words.every(w => hay.includes(w));
  });
  box.replaceChildren();
  if (!hits.length) { box.append(el('div', { className: 'empty', textContent: library.length ? 'No songs match.' : 'No song files found.' })); return; }
  const LIMIT = 300;
  for (const f of hits.slice(0, LIMIT)) {
    const where = [f.source === 'ProPresenter' ? f.folder : 'Songs folder', f.type].filter(Boolean).join(', ');
    const name = el('div', { className: 'name', title: 'Preview slides' }, el('b', { textContent: f.name }), el('small', { textContent: where }));
    name.addEventListener('click', () => preview(f.stored, f.name));
    const add = el('button', { className: 'icon', textContent: '+', title: 'Add to the set list', ariaLabel: `Add ${f.name}` });
    add.addEventListener('click', () => addSong(f));
    box.append(el('div', { className: 'lib-row' + (inSet.has(f.stored) ? ' in-set' : '') }, name, add));
  }
  if (hits.length > LIMIT) box.append(el('div', { className: 'empty', textContent: `${hits.length - LIMIT} more. Type in the search box to narrow the list.` }));
}

// ------------------------------------------------------------ set lists
function applyLists(data) {
  setlists = data.setlists; active = data.active; useBanks = data.useBanks;
  const sel = $('setSelect');
  sel.replaceChildren(...(setlists.length
    ? setlists.map(n => el('option', { value: n, textContent: n + (n === active ? '  (in use)' : '') }))
    : [el('option', { value: '', textContent: 'No set lists yet: click New' })]));
  sel.value = current;
  renderActive();
}

function renderActive() {
  const on = current && current === active;
  const flag = $('activeFlag');
  flag.className = 'active-flag' + (on ? ' on' : '');
  flag.textContent = on ? '● In use: MIDI picks songs from this list' : active ? `In use: ${active}` : 'No set list in use';
  $('useSet').textContent = on ? 'Stop using this list' : 'Use for the service';
  for (const id of ['useSet', 'copySet', 'renameSet', 'deleteSet', 'renumber']) $(id).disabled = !current;
}

async function loadSetlists() {
  try {
    const data = await api('/api/setlists');
    if (!current || !data.setlists.includes(current)) current = data.active || data.setlists[data.setlists.length - 1] || '';
    applyLists(data);
    if (current) await openSetlist(current); else { entries = []; renderEntries(); }
  } catch (e) { status(e.message, true); }
}

async function openSetlist(name) {
  await flushSave();
  try {
    const data = await api('/api/setlist?name=' + encodeURIComponent(name));
    current = data.name; entries = data.entries; version = savedVersion = 0;
    applyLists(data);
    renderEntries(); renderLibrary();
    status('');
  } catch (e) { status(e.message, true); }
}

function renderEntries() {
  const box = $('entries');
  box.replaceChildren();
  if (!current) { box.append(el('div', { className: 'empty', textContent: 'Make a set list with New, then add songs from the library with +.' })); return; }
  if (!entries.length) { box.append(el('div', { className: 'empty', textContent: 'Empty. Add songs from the library with +.' })); return; }
  const dups = duplicates();
  const table = el('table');
  entries.forEach((e, i) => {
    const num = el('input', { type: 'number', min: 1, max: 16384, value: e.number, ariaLabel: `Number for ${e.title}`, className: dups.has(e.number) ? 'dup' : '' });
    num.addEventListener('change', () => {
      const n = Math.round(Number(num.value));
      if (!(n >= 1 && n <= 16384)) { num.value = e.number; status('Song numbers are 1 to 16384.', true); return; }
      e.number = n; sortEntries(); changed();
    });
    const sub = [e.folder, e.missing ? null : `${e.slides} slides`].filter(Boolean).join(', ');
    const title = el('td', { className: 'title', title: 'Preview slides' },
      e.title,
      el('small', {}, e.missing ? el('span', { className: 'warn', textContent: 'File not found. ' }) : null, sub));
    title.addEventListener('click', () => preview(e.stored, e.title));
    const up = el('button', { className: 'icon', textContent: '↑', disabled: i === 0, ariaLabel: `Move ${e.title} up` });
    const down = el('button', { className: 'icon', textContent: '↓', disabled: i === entries.length - 1, ariaLabel: `Move ${e.title} down` });
    const del = el('button', { className: 'icon danger', textContent: '✕', ariaLabel: `Remove ${e.title}` });
    up.addEventListener('click', () => swap(i, i - 1));
    down.addEventListener('click', () => swap(i, i + 1));
    del.addEventListener('click', () => { entries.splice(i, 1); changed(); });
    table.append(el('tr', { className: e.stored === selected ? 'selected' : '' },
      el('td', { className: 'num' }, num), title,
      el('td', { className: 'midi', textContent: midiText(e.number) }),
      el('td', { className: 'tools' }, up, ' ', down, ' ', del)));
  });
  box.append(table);
  if (dups.size) status(`Two songs share number ${[...dups].join(', ')}. Change one of them.`, true);
}

function sortEntries() { entries.sort((a, b) => a.number - b.number); }

// Moving keeps the numbers in place and swaps the songs, so the list stays in number order.
function swap(i, j) {
  if (j < 0 || j >= entries.length) return;
  [entries[i].number, entries[j].number] = [entries[j].number, entries[i].number];
  sortEntries(); changed();
}

async function addSong(f) {
  if (!current) {
    const name = await askName('Name for the new set list', nextSunday());
    if (!name) return;
    if (!await create(name)) return;
  }
  if (entries.some(e => e.stored === f.stored) && !confirm(`${f.name} is already in this set list. Add it again?`)) return;
  const number = entries.reduce((m, e) => Math.max(m, e.number), 0) + 1;
  entries.push({ number, stored: f.stored, title: f.name, missing: false, slides: 0, folder: f.source === 'ProPresenter' ? f.folder : '' });
  changed();
  const box = $('entries');
  box.scrollTop = box.scrollHeight;
}

function changed() {
  version++;
  renderEntries(); renderLibrary();
  status('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}

async function save() {
  clearTimeout(saveTimer); saveTimer = null;
  if (saving || version === savedVersion || !current) return;
  saving = true;
  const sending = version, name = current;
  try {
    const data = await api('/api/setlist/save', { name, entries: entries.map(e => ({ number: e.number, stored: e.stored })) });
    savedVersion = sending;
    if (current === name && version === sending) { entries = data.entries; renderEntries(); }
    applyLists(data);
    if (!duplicates().size) status(name === active ? 'Saved. Changes are live.' : 'Saved.');
  } catch (e) { status('Not saved: ' + e.message, true); }
  saving = false;
  if (version !== savedVersion && current === name) save();
}

async function flushSave() {
  if (saveTimer) await save();
  while (saving) await new Promise(r => setTimeout(r, 50));
}

async function askName(question, suggestion) {
  const name = (prompt(question, suggestion) || '').trim();
  return name || null;
}

async function create(name, from) {
  await flushSave();
  try {
    const data = await api('/api/setlist/create', { name, from });
    current = data.name; entries = data.entries; version = savedVersion = 0;
    applyLists(data); renderEntries(); renderLibrary();
    status(from ? `Copied to ${name}.` : `Made ${name}.`);
    return true;
  } catch (e) { status(e.message, true); return false; }
}

// ------------------------------------------------------------ preview
async function preview(stored, title) {
  selected = stored;
  renderEntries();
  $('previewTitle').textContent = title;
  $('previewNote').textContent = 'Loading…';
  const box = $('preview');
  try {
    const data = await api('/api/preview?file=' + encodeURIComponent(stored));
    if (selected !== stored) return;
    box.replaceChildren();
    let group = null;
    data.slides.forEach((s, i) => {
      if (s.group && s.group !== group) box.append(el('div', { className: 'group', textContent: s.group }));
      group = s.group;
      box.append(el('div', { className: 'slide' }, el('span', { textContent: i + 1 }),
        s.text ? el('span', { textContent: s.text }) : el('span', { className: 'blank', textContent: 'blank slide' })));
    });
    if (!data.slides.length) box.append(el('div', { className: 'empty', textContent: 'No slides with text in this file.' }));
    $('previewNote').textContent = `${data.slides.length} slides. The number is the MIDI note for each slide.`;
  } catch (e) {
    box.replaceChildren(el('div', { className: 'empty', textContent: e.message }));
    $('previewNote').textContent = '';
  }
}

// ------------------------------------------------------------ buttons
$('search').addEventListener('input', renderLibrary);
$('refreshLib').addEventListener('click', () => loadLibrary(true));
$('setSelect').addEventListener('change', e => { if (e.target.value) openSetlist(e.target.value); });

$('newSet').addEventListener('click', async () => {
  const name = await askName('Name for the new set list', nextSunday());
  if (name) await create(name);
});

$('copySet').addEventListener('click', async () => {
  const name = await askName(`Copy "${current}" as`, nextSunday());
  if (name) { await flushSave(); await create(name, current); }
});

$('renameSet').addEventListener('click', async () => {
  const to = await askName(`New name for "${current}"`, current);
  if (!to || to === current) return;
  await flushSave();
  try {
    const data = await api('/api/setlist/rename', { name: current, to });
    current = data.name; applyLists(data); status(`Renamed to ${to}.`);
  } catch (e) { status(e.message, true); }
});

$('deleteSet').addEventListener('click', async () => {
  if (!confirm(`Delete the set list "${current}"? The song files are not touched.`)) return;
  await flushSave();
  try {
    const data = await api('/api/setlist/delete', { name: current });
    status(`Deleted ${current}.`);
    current = data.setlists[data.setlists.length - 1] || '';
    applyLists(data);
    if (current) await openSetlist(current); else { entries = []; renderEntries(); renderLibrary(); }
  } catch (e) { status(e.message, true); }
});

$('useSet').addEventListener('click', async () => {
  await flushSave();
  try {
    const data = await api('/api/setlist/activate', { name: current === active ? '' : current });
    applyLists(data);
    status(data.active ? `${data.active} is in use. MIDI song numbers now come from this list.` : 'No set list in use.');
  } catch (e) { status(e.message, true); }
});

$('renumber').addEventListener('click', () => {
  if (!entries.length) return;
  entries.forEach((e, i) => { e.number = i + 1; });
  changed();
});

window.addEventListener('beforeunload', e => { if (saveTimer || saving) { save(); e.preventDefault(); } });

loadSetlists().then(() => loadLibrary(false));
</script>
</body>
</html>
